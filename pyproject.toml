[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "penflow"
version = "0.1.0"
description = "Deterministic CLI for Pencil .pen contracts, UI-tree validation, and structural comparison."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Julien M" }]
dependencies = ["PyYAML>=6.0", "jsonschema>=4"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.0"]

[project.scripts]
penflow = "penflow.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
explicit_package_bases = true
disable_error_code = ["import-untyped"]
