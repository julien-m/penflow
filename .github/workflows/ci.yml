name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # required for changed-files action

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
          restore-keys: pip-

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          elif [ -f pyproject.toml ]; then
            pip install .
          else
            echo "No supported Python dependency file found."
          fi

      - name: Get changed Python files
        id: changed-src
        uses: tj-actions/changed-files@48d8f15b2aaa3d255ca5af3eba4870f807ce6b3c
        with:
          separator: "\n"
          files: |
            **/*.py

      - name: Get changed linter config files
        id: changed-cfg
        uses: tj-actions/changed-files@48d8f15b2aaa3d255ca5af3eba4870f807ce6b3c
        with:
          files: |
            pyproject.toml
            ruff.toml
            .ruff.toml

      - name: Format check
        shell: bash
        env:
          CFG_CHANGED: ${{ steps.changed-cfg.outputs.any_changed }}
          SRC_FILES: ${{ steps.changed-src.outputs.all_changed_files }}
        run: |
          if [ "$CFG_CHANGED" = "true" ]; then
            ruff format --check .
          elif [ -n "$SRC_FILES" ]; then
            mapfile -t files <<< "$SRC_FILES"
            ruff format --check "${files[@]}"
          else
            echo "No Python changes, skipping format check."
          fi

      - name: Lint
        shell: bash
        env:
          CFG_CHANGED: ${{ steps.changed-cfg.outputs.any_changed }}
          SRC_FILES: ${{ steps.changed-src.outputs.all_changed_files }}
        run: |
          if [ "$CFG_CHANGED" = "true" ]; then
            ruff check .
          elif [ -n "$SRC_FILES" ]; then
            mapfile -t files <<< "$SRC_FILES"
            ruff check "${files[@]}"
          else
            echo "No Python changes, skipping lint."
          fi

      - name: Typecheck
        shell: bash
        run: |
          if grep -qE '^\[tool\.mypy' pyproject.toml 2>/dev/null || test -f mypy.ini || test -f .mypy.ini; then
            pip show mypy >/dev/null 2>&1 || pip install mypy -q
            mypy .
          elif grep -qE '^\[tool\.pyright' pyproject.toml 2>/dev/null || test -f pyrightconfig.json; then
            pip show pyright >/dev/null 2>&1 || pip install pyright -q
            pyright
          else
            echo "No type checker configured - skipping"
          fi

      - name: Run tests
        shell: bash
        run: |
          if command -v pytest >/dev/null 2>&1; then
            python -m pytest
          else
            echo "pytest not installed, skipping tests."
          fi
