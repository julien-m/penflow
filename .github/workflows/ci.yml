# Maintained locally by Penflow to enforce its locked CI contract.
# conventions-init must treat this workflow as user-owned and preserve it.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0  # required for changed-files action

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        shell: bash
        run: |
          uv sync --extra dev --locked
          uv venv "$RUNNER_TEMP/penflow-legacy"
          uv pip install --python "$RUNNER_TEMP/penflow-legacy/bin/python" "mistune==3.2.0" "PyYAML==6.0.3"

      - name: Get changed Python files
        id: changed-src
        uses: tj-actions/changed-files@48d8f15b2aaa3d255ca5af3eba4870f807ce6b3c
        with:
          separator: " "
          files: |
            **/*.py

      - name: Get changed linter config files
        id: changed-cfg
        uses: tj-actions/changed-files@48d8f15b2aaa3d255ca5af3eba4870f807ce6b3c
        with:
          files: |
            pyproject.toml
            ruff.toml
            .ruff.toml

      - name: Format check
        shell: bash
        env:
          CFG_CHANGED: ${{ steps.changed-cfg.outputs.any_changed }}
          SRC_FILES: ${{ steps.changed-src.outputs.all_changed_files }}
        run: |
          if [ "$CFG_CHANGED" = "true" ]; then
            uv run --no-sync ruff format --check .
          elif [ -n "$SRC_FILES" ]; then
            read -r -a files <<< "$SRC_FILES"
            uv run --no-sync ruff format --check "${files[@]}"
          else
            echo "No Python changes, skipping format check."
          fi

      - name: Lint
        shell: bash
        env:
          CFG_CHANGED: ${{ steps.changed-cfg.outputs.any_changed }}
          SRC_FILES: ${{ steps.changed-src.outputs.all_changed_files }}
        run: |
          if [ "$CFG_CHANGED" = "true" ]; then
            uv run --no-sync ruff check .
          elif [ -n "$SRC_FILES" ]; then
            read -r -a files <<< "$SRC_FILES"
            uv run --no-sync ruff check "${files[@]}"
          else
            echo "No Python changes, skipping lint."
          fi

      - name: Typecheck
        shell: bash
        run: |
          if grep -qE '^\[tool\.mypy' pyproject.toml 2>/dev/null || test -f mypy.ini || test -f .mypy.ini; then
            uv run --no-sync mypy .
          elif grep -qE '^\[tool\.pyright' pyproject.toml 2>/dev/null || test -f pyrightconfig.json; then
            uv run --no-sync pyright
          else
            echo "No type checker configured - skipping"
          fi

      - name: Run tests
        shell: bash
        env:
          PENFLOW_LEGACY_PYTHON: ${{ runner.temp }}/penflow-legacy/bin/python
        run: uv run --no-sync python -m pytest

      - name: Build wheel and source distribution
        shell: bash
        run: uv build

      - name: Exhaustive semantic coverage gate
        shell: bash
        run: >-
          uv run --no-sync python -m pytest -q
          tests/test_semantic_context_coverage.py::test_audit_context_coverage_cli_writes_report_and_uses_exact_exit_codes
          tests/test_run_pipeline.py::test_strict_semantic_coverage_stops_before_validate_pen

  qe7:
    name: Feature 074 large-tree evidence
    runs-on: ubuntu-latest
    # QE7 must fail closed instead of occupying a runner indefinitely.
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        shell: bash
        run: uv sync --extra dev --locked

      - name: Prepare isolated QE7 consumer
        shell: bash
        run: |
          QE7_CONSUMER="$RUNNER_TEMP/penflow-qe7-consumer"
          mkdir -p "$QE7_CONSUMER"
          git -C "$QE7_CONSUMER" init -q
          git -C "$QE7_CONSUMER" config user.email "penflow-ci@example.invalid"
          git -C "$QE7_CONSUMER" config user.name "Penflow CI"
          echo "QE7_CONSUMER=$QE7_CONSUMER" >> "$GITHUB_ENV"
          uv run --no-sync penflow doctor --project "$QE7_CONSUMER" --check --json > "$RUNNER_TEMP/qe7-doctor-start.json" || test "$?" -eq 1
          uv run --no-sync python - "$RUNNER_TEMP/qe7-doctor-start.json" <<'PY'
          import json
          import sys

          allowed = {
              "pen.missing",
              "gitignore.managed_block_missing",
              "gitignore.managed_block_outdated",
              "gitignore.managed_block_duplicate",
          }
          with open(sys.argv[1], encoding="utf-8") as receipt:
              report = json.load(receipt)
          codes = {
              issue["code"] for issue in report["stable_result"]["findings"]
          }
          if not codes or not codes <= allowed:
              raise SystemExit(f"unsafe QE7 Doctor bootstrap findings: {sorted(codes)}")
          PY
          uv run --no-sync penflow doctor --project "$QE7_CONSUMER" --fix --json
          uv run --no-sync penflow doctor --project "$QE7_CONSUMER" --check --json
          cp -R "$GITHUB_WORKSPACE/tests" "$QE7_CONSUMER/tests"
          mkdir -p "$QE7_CONSUMER/.specs/features/074-penflow-doctor-consumer-project-hygiene/checks"
          git -C "$QE7_CONSUMER" add .gitignore penflow/ui.pen tests
          git -C "$QE7_CONSUMER" commit -q -m "Initialize isolated QE7 consumer"

      - name: Capture pre-QE7 Doctor receipt
        shell: bash
        run: >-
          uv run --no-sync penflow doctor --project "$QE7_CONSUMER" --check --json
          > "$QE7_CONSUMER/.specs/features/074-penflow-doctor-consumer-project-hygiene/checks/qe7-doctor-before.json"

      - name: Run bounded large-tree gate
        shell: bash
        run: >-
          uv run --no-sync python tests/quality_gate_receipt.py qe7
          --project "$QE7_CONSUMER"
          --out "$QE7_CONSUMER/.specs/features/074-penflow-doctor-consumer-project-hygiene/checks/qe7-large-tree.json"
        env:
          PENFLOW_QE7_CONSUMER: ${{ env.QE7_CONSUMER }}

      - name: Capture post-QE7 Doctor receipt
        shell: bash
        run: >-
          uv run --no-sync penflow doctor --project "$QE7_CONSUMER" --check --json
          > "$QE7_CONSUMER/.specs/features/074-penflow-doctor-consumer-project-hygiene/checks/qe7-doctor-after.json"

      - name: Upload QE7 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: penflow-074-qe7-${{ github.sha }}
          # Keep bounded large-tree evidence for one monthly audit/reproduction window.
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ env.QE7_CONSUMER }}/.specs/features/074-penflow-doctor-consumer-project-hygiene/checks/qe7-large-tree.json
            ${{ env.QE7_CONSUMER }}/.specs/features/074-penflow-doctor-consumer-project-hygiene/checks/qe7-large-tree-metrics.json
            ${{ env.QE7_CONSUMER }}/.specs/features/074-penflow-doctor-consumer-project-hygiene/checks/qe7-doctor-before.json
            ${{ env.QE7_CONSUMER }}/.specs/features/074-penflow-doctor-consumer-project-hygiene/checks/qe7-doctor-after.json
            ${{ env.QE7_CONSUMER }}/.specs/features/074-penflow-doctor-consumer-project-hygiene/checks/transcripts/qe7-*
